syntax = "proto3";

package protoform.conformance.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

// The lifecycle state of a book.
enum BookState {
  // The book state is not specified.
  BOOK_STATE_UNSPECIFIED = 0;
  // The book is available.
  BOOK_STATE_ACTIVE = 1;
  // The book is being deleted.
  BOOK_STATE_DELETING = 2;
  // The book is soft deleted.
  BOOK_STATE_DELETED = 3;
}

// A book managed by the library service.
message Book {
  option (google.api.resource) = {
    type: "library.protoform.dev/Book"
    pattern: "publishers/{publisher}/books/{book}"
    singular: "book"
    plural: "books"
  };

  // The resource name of the book.
  // Format: publishers/{publisher}/books/{book}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The system-assigned UUID for the book.
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The display name of the book.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
  // The time when the book was created.
  google.protobuf.Timestamp create_time = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  // The time when the book was last updated.
  google.protobuf.Timestamp update_time = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  // The time when the book was soft deleted.
  google.protobuf.Timestamp delete_time = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  // ISBN-13 digits. The CEL rule enforces the alternating 1/3 checksum.
  string isbn = 7 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9]{13}$",
    (buf.validate.field).cel = {
      id: "book.isbn13_check_digit"
      message: "ISBN must have a valid ISBN-13 check digit."
      expression: "!this.matches('^[0-9]{13}$') || (int(this.substring(0, 1)) + int(this.substring(1, 2)) * 3 + int(this.substring(2, 3)) + int(this.substring(3, 4)) * 3 + int(this.substring(4, 5)) + int(this.substring(5, 6)) * 3 + int(this.substring(6, 7)) + int(this.substring(7, 8)) * 3 + int(this.substring(8, 9)) + int(this.substring(9, 10)) * 3 + int(this.substring(10, 11)) + int(this.substring(11, 12)) * 3 + int(this.substring(12, 13))) % 10 == 0"
    }
  ];
  // An optional token consumed while creating or updating the book.
  string input_token = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = INPUT_ONLY
  ];
  // An optional note about the book.
  optional string note = 9 [(google.api.field_behavior) = OPTIONAL];
  // The checksum used for optimistic concurrency control.
  string etag = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The requested expiration policy for the book.
  oneof expiration {
    // The absolute time when the book expires.
    google.protobuf.Timestamp expire_time = 11;
    // The duration after creation when the book expires.
    google.protobuf.Duration ttl = 12 [
      (google.api.field_behavior) = OPTIONAL,
      (google.api.field_behavior) = INPUT_ONLY
    ];
  }
  // The current lifecycle state of the book.
  BookState state = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The time when the soft-deleted book will be permanently removed.
  google.protobuf.Timestamp purge_time = 14 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message BookRevision {
  option (google.api.resource) = {
    type: "library.protoform.dev/BookRevision"
    pattern: "publishers/{publisher}/books/{book}/revisions/{revision}"
    singular: "bookRevision"
    plural: "bookRevisions"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  Book snapshot = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  repeated string alternate_ids = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

// The request for LibraryService.CreateBook.
message CreateBookRequest {
  // The publisher in which to create the book.
  // Format: publishers/{publisher}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  // The book to create.
  Book book = 2 [(google.api.field_behavior) = REQUIRED];
  // The ID to use for the book, which becomes the final resource-name segment.
  string book_id = 3 [(google.api.field_behavior) = REQUIRED];
  // An optional UUID that makes retries idempotent.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // Whether to validate the request without applying it.
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

// The request for LibraryService.GetBook.
message GetBookRequest {
  // The name of the book to retrieve.
  // Format: publishers/{publisher}/books/{book}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/Book"
  ];
}

// The request for LibraryService.ListBooks.
message ListBooksRequest {
  option (buf.validate.message).cel = {
    id: "aip159.cross_collection_order"
    message: "order by is unavailable when reading across collections"
    expression: "!this.parent.endsWith('/-') || this.order_by == ''"
  };
  option (buf.validate.message).cel = {
    id: "aip217.partial_success_scope"
    message: "partial success is available only when reading across collections"
    expression: "!this.return_partial_success || this.parent.endsWith('/-')"
  };

  // The publisher whose books are listed.
  // Format: publishers/{publisher}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  // The maximum number of books to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // A token identifying the next result page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  // An optional filter applied to the books.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
  // An optional ordering expression for the books.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
  // Whether cross-collection reads may return partial results.
  bool return_partial_success = 6 [(google.api.field_behavior) = OPTIONAL];
  // Whether soft-deleted books are included.
  bool show_deleted = 7 [(google.api.field_behavior) = OPTIONAL];
}

// The response from LibraryService.ListBooks.
message ListBooksResponse {
  // The books in the requested page.
  repeated Book books = 1;
  // A token that retrieves the next page, or empty when no page remains.
  string next_page_token = 2;
  // Locations that could not be reached for a partial-success request.
  repeated string unreachable = 3 [
    (google.api.field_behavior) = UNORDERED_LIST
  ];
}

// The request for LibraryService.UpdateBook.
message UpdateBookRequest {
  // The book with updated values. Its name identifies the target.
  Book book = 1 [(google.api.field_behavior) = REQUIRED];
  // The fields to update. Omit to update every populated field.
  google.protobuf.FieldMask update_mask = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];
  // An optional UUID that makes retries idempotent.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // Whether to validate the request without applying it.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The request for LibraryService.DeleteBook.
message DeleteBookRequest {
  // The name of the book to soft delete.
  // Format: publishers/{publisher}/books/{book}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/Book"
  ];
  // The etag that must match the current book when provided.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
  // An optional UUID that makes retries idempotent.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // Whether to validate the request without applying it.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  // Whether to delete child resources with the book.
  bool force = 5 [(google.api.field_behavior) = OPTIONAL];
  // Whether repeated deletion succeeds when the book is already soft deleted.
  bool allow_missing = 6 [(google.api.field_behavior) = OPTIONAL];
}

// The request for LibraryService.UndeleteBook.
message UndeleteBookRequest {
  // The name of the soft-deleted book to restore.
  // Format: publishers/{publisher}/books/{book}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/Book"
  ];
}

// The request for LibraryService.ExpungeBook.
message ExpungeBookRequest {
  // The name of the soft-deleted book to permanently remove.
  // Format: publishers/{publisher}/books/{book}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/Book"
  ];
}

message BatchGetBooksRequest {
  string parent = 1 [
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  repeated string names = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/Book"
  ];
}

message BatchGetBooksResponse {
  repeated Book books = 1;
}

message BatchCreateBooksRequest {
  string parent = 1 [
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  repeated CreateBookRequest requests = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message BatchCreateBooksResponse {
  repeated Book books = 1;
}

message BatchUpdateBooksRequest {
  string parent = 1 [
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  repeated UpdateBookRequest requests = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message BatchUpdateBooksResponse {
  repeated Book books = 1;
}

message BatchDeleteBooksRequest {
  string parent = 1 [
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  repeated DeleteBookRequest requests = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message BatchDeleteBooksResponse {
  repeated Book books = 1;
}

message ProjectSettings {
  option (google.api.resource) = {
    type: "library.protoform.dev/ProjectSettings"
    pattern: "projects/{project}/settings"
    singular: "projectSettings"
    plural: "projectSettings"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string theme = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetProjectSettingsRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/ProjectSettings"
  ];
}

message UpdateProjectSettingsRequest {
  ProjectSettings project_settings = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
  google.protobuf.FieldMask update_mask = 2 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ProvisionCapacityRequest {
  // Storage capacity in binary gibibytes (GiB).
  int64 storage_gibibytes = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64.gte = 0
  ];

  // Number of replicas to provision.
  int32 replica_count = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32.gte = 0
  ];

  // ISO 4217 currency code, such as GBP.
  // https://www.iso.org/iso-4217-currency-codes.html
  optional string currency_code = 3 [
    (buf.validate.field).string.pattern = "^[A-Za-z]{3}$"
  ];

  // BCP 47 language code, such as en-GB.
  // https://www.rfc-editor.org/info/bcp47
  optional string language_code = 4 [
    (buf.validate.field).string.pattern = "^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$"
  ];

  // CLDR region code, such as GB.
  // https://unicode.org/cldr/charts/latest/supplemental/territory_information.html
  optional string region_code = 5 [
    (buf.validate.field).string.pattern = "^[A-Za-z]{2}$"
  ];

  // IANA time zone identifier, such as Europe/London.
  // https://www.iana.org/time-zones
  optional string time_zone = 6 [
    (buf.validate.field).string.pattern = "^[A-Za-z._+-]+(/[A-Za-z0-9._+-]+)+$"
  ];
}

message TimeRange {
  option (buf.validate.message).cel = {
    id: "aip145.time_range"
    message: "end time must be later than start time"
    expression: "!has(this.start_time) || !has(this.end_time) || this.start_time < this.end_time"
  };

  // Inclusive start of the time range. Omit for an open lower bound.
  optional google.protobuf.Timestamp start_time = 1;

  // Exclusive end of the time range. Omit for an open upper bound.
  optional google.protobuf.Timestamp end_time = 2;
}

message WriteBookJob {
  option (google.api.resource) = {
    type: "library.protoform.dev/WriteBookJob"
    pattern: "publishers/{publisher}/writeBookJobs/{write_book_job}"
    singular: "writeBookJob"
    plural: "writeBookJobs"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  string schedule = 3 [(google.api.field_behavior) = OPTIONAL];
}

message CreateWriteBookJobRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "library.protoform.dev/WriteBookJob"
  ];
  WriteBookJob write_book_job = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
  string write_book_job_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message RunWriteBookJobRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/WriteBookJob"
  ];
}

message CloudStorageSource {
  string uri = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^gs://[^/]+/.+$"
  ];
}

message InlineSource {
  repeated Book books = 1 [(buf.validate.field).repeated.min_items = 1];
}

message ImportBooksRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  oneof source {
    option (buf.validate.oneof).required = true;
    CloudStorageSource cloud_storage_source = 2;
    InlineSource inline_source = 3;
  }
  string isbn_prefix = 4;
}

message CloudStorageDestination {
  string uri = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^gs://[^/]+/.+$"
  ];
}

message ArchiveDestination {
  string archive_name = 1 [(google.api.field_behavior) = REQUIRED];
}

message ExportBooksRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  oneof destination {
    option (buf.validate.oneof).required = true;
    CloudStorageDestination cloud_storage_destination = 2;
    ArchiveDestination archive_destination = 3;
  }
  string filter = 4;
}

message ImportBooksMetadata {
  repeated google.rpc.Status partial_failures = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message PurgeBooksRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "library.protoform.dev/Book"
  ];
  string filter = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  bool force = 3;
}

message PurgeBooksResponse {
  int32 purge_count = 1;
  repeated string purge_sample = 2 [
    (google.api.resource_reference).type = "library.protoform.dev/Book"
  ];
}

message Policy {
  option (google.api.resource) = {
    type: "library.protoform.dev/Policy"
    pattern: "projects/{project}/locations/{location}/policies/{policy}"
    singular: "policy"
    plural: "policies"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  repeated string allowed_publishers = 2;
  string etag = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

enum PolicyPreviewState {
  POLICY_PREVIEW_STATE_UNSPECIFIED = 0;
  POLICY_PREVIEW_STATE_ACTIVE = 1;
  POLICY_PREVIEW_STATE_SUSPENDED = 2;
}

message PolicyPreviewMetadata {
  PolicyPreviewState state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string log_prefix = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp start_time = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  google.protobuf.Timestamp stop_time = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

message PolicyExperiment {
  option (google.api.resource) = {
    type: "library.protoform.dev/PolicyExperiment"
    pattern: "projects/{project}/locations/{location}/policies/{policy}/experiments/{experiment}"
    singular: "policyExperiment"
    plural: "policyExperiments"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  Policy policy = 2 [(google.api.field_behavior) = REQUIRED];
  PolicyPreviewMetadata preview_metadata = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
  map<string, string> annotations = 4;
  string etag = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message StartPreviewPolicyExperimentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/PolicyExperiment"
  ];
}

message StopPreviewPolicyExperimentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/PolicyExperiment"
  ];
}

message CommitPolicyExperimentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "library.protoform.dev/PolicyExperiment"
  ];
  string etag = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  string parent_etag = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Manages books in the library catalog.
service LibraryService {
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // AIP-131 returns the requested resource directly.
  rpc GetBook(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/v1/{name=publishers/*/books/*}"
    };
    option (google.api.method_signature) = "name";
  }
  // Lists books in a publisher.
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=publishers/*}/books"
    };
    option (google.api.method_signature) = "parent";
  }
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // AIP-133 returns the created resource directly.
  rpc CreateBook(CreateBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/{parent=publishers/*}/books"
      body: "book"
    };
    option (google.api.method_signature) = "parent,book,book_id";
  }
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // AIP-134 returns the updated resource directly.
  rpc UpdateBook(UpdateBookRequest) returns (Book) {
    option (google.api.http) = {
      patch: "/v1/{book.name=publishers/*/books/*}"
      body: "book"
    };
    option (google.api.method_signature) = "book,update_mask";
  }
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // Soft deletes a book and returns its updated state.
  rpc DeleteBook(DeleteBookRequest) returns (Book) {
    option (google.api.http) = {
      delete: "/v1/{name=publishers/*/books/*}"
    };
    option (google.api.method_signature) = "name";
  }
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // Restores a soft-deleted book.
  rpc UndeleteBook(UndeleteBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/{name=publishers/*/books/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // Permanently deletes a soft-deleted book.
  rpc ExpungeBook(ExpungeBookRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=publishers/*/books/*}:expunge"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
