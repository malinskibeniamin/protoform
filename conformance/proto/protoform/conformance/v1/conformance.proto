  optional int32 int32_range = 2 [(buf.validate.field).int32 = { gte: 1, lte: 10 }];
  optional int32 int32_allowed = 3 [(buf.validate.field).int32 = { in: [1, 7] }];
  optional int32 int32_denied = 4 [(buf.validate.field).int32 = { not_in: [8, 9] }];
  optional int32 int32_reversed = 5 [(buf.validate.field).int32 = { gt: 10, lt: 5 }];
  optional sint32 sint32_const = 6 [(buf.validate.field).sint32.const = 7];
  optional sint32 sint32_range = 7 [(buf.validate.field).sint32 = { gte: 1, lte: 10 }];
  optional sint32 sint32_allowed = 8 [(buf.validate.field).sint32 = { in: [1, 7] }];
  optional sint32 sint32_denied = 9 [(buf.validate.field).sint32 = { not_in: [8, 9] }];
  optional sint32 sint32_reversed = 10 [(buf.validate.field).sint32 = { gt: 10, lt: 5 }];
  optional sfixed32 sfixed32_const = 11 [(buf.validate.field).sfixed32.const = 7];
  optional sfixed32 sfixed32_range = 12 [(buf.validate.field).sfixed32 = { gte: 1, lte: 10 }];
  optional sfixed32 sfixed32_allowed = 13 [(buf.validate.field).sfixed32 = { in: [1, 7] }];
  optional sfixed32 sfixed32_denied = 14 [(buf.validate.field).sfixed32 = { not_in: [8, 9] }];
  optional sfixed32 sfixed32_reversed = 15 [(buf.validate.field).sfixed32 = { gt: 10, lt: 5 }];
