  optional int64 int64_range = 17 [(buf.validate.field).int64 = { gte: 1, lte: 10 }];
  optional int64 int64_allowed = 18 [(buf.validate.field).int64 = { in: [1, 7] }];
  optional int64 int64_denied = 19 [(buf.validate.field).int64 = { not_in: [8, 9] }];
  optional int64 int64_reversed = 20 [(buf.validate.field).int64 = { gt: 10, lt: 5 }];
  optional sint64 sint64_const = 21 [(buf.validate.field).sint64.const = 7];
  optional sint64 sint64_range = 22 [(buf.validate.field).sint64 = { gte: 1, lte: 10 }];
  optional sint64 sint64_allowed = 23 [(buf.validate.field).sint64 = { in: [1, 7] }];
  optional sint64 sint64_denied = 24 [(buf.validate.field).sint64 = { not_in: [8, 9] }];
  optional sint64 sint64_reversed = 25 [(buf.validate.field).sint64 = { gt: 10, lt: 5 }];
  optional sfixed64 sfixed64_const = 26 [(buf.validate.field).sfixed64.const = 7];
  optional sfixed64 sfixed64_range = 27 [(buf.validate.field).sfixed64 = { gte: 1, lte: 10 }];
  optional sfixed64 sfixed64_allowed = 28 [(buf.validate.field).sfixed64 = { in: [1, 7] }];
  optional sfixed64 sfixed64_denied = 29 [(buf.validate.field).sfixed64 = { not_in: [8, 9] }];
  optional sfixed64 sfixed64_reversed = 30 [(buf.validate.field).sfixed64 = { gt: 10, lt: 5 }];
  optional uint32 uint32_const = 31 [(buf.validate.field).uint32.const = 7];
  optional uint32 uint32_range = 32 [(buf.validate.field).uint32 = { gte: 1, lte: 10 }];
  optional uint32 uint32_allowed = 33 [(buf.validate.field).uint32 = { in: [1, 7] }];
  optional uint32 uint32_denied = 34 [(buf.validate.field).uint32 = { not_in: [8, 9] }];
  optional uint32 uint32_reversed = 35 [(buf.validate.field).uint32 = { gt: 10, lt: 5 }];
  optional fixed32 fixed32_const = 36 [(buf.validate.field).fixed32.const = 7];
