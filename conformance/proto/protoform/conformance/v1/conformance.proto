syntax = "proto3";

package protoform.conformance.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "protoform/conformance/v1/predefined.proto";

message NumericMatrix {
  bool enabled = 1;
  int32 int32_value = 2;
  sint32 sint32_value = 3;
  sfixed32 sfixed32_value = 4;
  uint32 uint32_value = 5;
  fixed32 fixed32_value = 6;
  sint64 sint64_value = 7;
  fixed64 fixed64_value = 8;
  sfixed64 sfixed64_value = 9;
  float float_value = 10;
  double double_value = 11;
}

enum MatrixStatus {
  // buf:lint:ignore ENUM_NO_ALLOW_ALIAS
  option allow_alias = true;

  MATRIX_STATUS_UNSPECIFIED = 0;
  MATRIX_STATUS_ACTIVE = 1;
  MATRIX_STATUS_ENABLED = 1;
  MATRIX_STATUS_PAUSED = 2;
}

message MatrixChild {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message CollectionMatrix {
  repeated bool flags = 1;
  repeated bytes blobs = 2;
  repeated MatrixStatus statuses = 3;
  repeated int64 identifiers = 4;
  repeated float ratios = 5;
  repeated double amounts = 6;
  repeated MatrixChild children = 7;
  map<bool, string> bool_keys = 8;
  map<int32, string> int32_keys = 9;
  map<sint32, string> sint32_keys = 10;
  map<sfixed32, string> sfixed32_keys = 11;
  map<uint32, string> uint32_keys = 12;
  map<fixed32, string> fixed32_keys = 13;
  map<int64, string> int64_keys = 14;
  map<sint64, string> sint64_keys = 15;
  map<sfixed64, string> sfixed64_keys = 16;
  map<uint64, string> uint64_keys = 17;
  map<fixed64, string> fixed64_keys = 18;
}

message PresenceMatrix {
  optional bool optional_enabled = 1;
  MatrixChild child = 2;

  oneof selection {
    string label = 3;
    bool approved = 4;
  }

  google.protobuf.DoubleValue double_wrapper = 5;
  google.protobuf.FloatValue float_wrapper = 6;
  google.protobuf.Int64Value int64_wrapper = 7;
  google.protobuf.UInt32Value uint32_wrapper = 8;
  google.protobuf.UInt64Value uint64_wrapper = 9;
  google.protobuf.BytesValue bytes_wrapper = 10;
}

message AnyMatrix {
  google.protobuf.Any allowed_payload = 1 [
    (buf.validate.field).any.in = "type.googleapis.com/google.protobuf.Struct"
  ];
  google.protobuf.Any denied_payload = 2 [
    (buf.validate.field).any.not_in = "type.googleapis.com/google.protobuf.Value"
  ];
}

message DynamicJsonMatrix {
  google.protobuf.Struct object_value = 1;
  google.protobuf.Value scalar_or_nested_value = 2;
  google.protobuf.ListValue list_value = 3;
  google.protobuf.Any any_value = 4;
}

message ValidationMatrix {
  bool must_be_true = 1 [(buf.validate.field).bool.const = true];
  bool must_be_false = 2 [(buf.validate.field).bool.const = false];
  string exact_text = 3 [(buf.validate.field).string.const = "protoform"];
  string code_point_length = 4 [(buf.validate.field).string = {
    min_len: 2
    max_len: 4
  }];
  string byte_length = 5 [(buf.validate.field).string = {
    min_bytes: 4
    max_bytes: 8
  }];
  string patterned_text = 6 [(buf.validate.field).string.pattern = "^[a-z]+$"];
  string prefixed_text = 7 [(buf.validate.field).string.prefix = "pre-"];
  string suffixed_text = 8 [(buf.validate.field).string.suffix = "-post"];
  string containing_text = 9 [(buf.validate.field).string.contains = "middle"];
  string allowed_text = 10 [(buf.validate.field).string = {
    in: "alpha"
    in: "beta"
  }];
  string blocked_text = 11 [(buf.validate.field).string = {
    not_in: "blocked"
    not_in: "denied"
  }];
  string email = 12 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
  string uuid = 13 [(buf.validate.field).string.uuid = true];
  string tuuid = 14 [(buf.validate.field).string.tuuid = true];
  MatrixStatus const_status = 15 [(buf.validate.field).enum.const = 1];
  MatrixStatus defined_status = 16 [(buf.validate.field).enum.defined_only = true];
  MatrixStatus allowed_status = 17 [(buf.validate.field).enum = {
    in: 1
    in: 2
  }];
  MatrixStatus blocked_status = 18 [(buf.validate.field).enum.not_in = 2];
  repeated string tags = 19 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 3
    unique: true
  }];
  repeated MatrixChild children = 20 [(buf.validate.field).repeated.max_items = 2];
  map<string, string> labels = 21 [(buf.validate.field).map = {
    min_pairs: 1
    max_pairs: 2
  }];
}

message EmailContract {
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
}
message FloatDoubleRules {
  optional float float_const = 1 [(buf.validate.field).float.const = 1.5];
  optional float float_range = 2 [(buf.validate.field).float = { gte: 1, lt: 5 }];
  optional float float_reversed = 3 [(buf.validate.field).float = { gt: 10, lt: 5 }];
  optional float float_allowed = 4 [(buf.validate.field).float = { in: [1, 2] }];
  optional float float_denied = 5 [(buf.validate.field).float = { not_in: [3, 4] }];
  optional float float_finite = 6 [(buf.validate.field).float.finite = true];
  optional double double_const = 7 [(buf.validate.field).double.const = 1.5];
  optional double double_range = 8 [(buf.validate.field).double = { gte: 1, lt: 5 }];
  optional double double_reversed = 9 [(buf.validate.field).double = { gt: 10, lt: 5 }];
  optional double double_allowed = 10 [(buf.validate.field).double = { in: [1, 2] }];
  optional double double_denied = 11 [(buf.validate.field).double = { not_in: [3, 4] }];
  optional double double_finite = 12 [(buf.validate.field).double.finite = true];
}

