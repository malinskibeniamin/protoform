  optional fixed32 fixed32_allowed = 38 [(buf.validate.field).fixed32 = { in: [1, 7] }];
  optional fixed32 fixed32_denied = 39 [(buf.validate.field).fixed32 = { not_in: [8, 9] }];
  optional fixed32 fixed32_reversed = 40 [(buf.validate.field).fixed32 = { gt: 10, lt: 5 }];
  optional uint64 uint64_const = 41 [(buf.validate.field).uint64.const = 7];
