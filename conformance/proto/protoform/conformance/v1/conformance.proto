message StringNetworkRules {
  optional string hostname = 1 [(buf.validate.field).string.hostname = true];
  optional string ip = 2 [(buf.validate.field).string.ip = true];
  optional string ipv4 = 3 [(buf.validate.field).string.ipv4 = true];
  optional string ipv6 = 4 [(buf.validate.field).string.ipv6 = true];
  optional string uri_reference = 5 [(buf.validate.field).string.uri_ref = true];
  optional string address = 6 [(buf.validate.field).string.address = true];
  optional string ip_with_prefix_length = 7 [(buf.validate.field).string.ip_with_prefixlen = true];
  optional string ipv4_with_prefix_length = 8 [(buf.validate.field).string.ipv4_with_prefixlen = true];
  optional string ipv6_with_prefix_length = 9 [(buf.validate.field).string.ipv6_with_prefixlen = true];
  optional string ip_prefix = 10 [(buf.validate.field).string.ip_prefix = true];
  optional string ipv4_prefix = 11 [(buf.validate.field).string.ipv4_prefix = true];
  optional string ipv6_prefix = 12 [(buf.validate.field).string.ipv6_prefix = true];
  optional string host_and_port = 13 [(buf.validate.field).string.host_and_port = true];
  optional string ulid = 14 [(buf.validate.field).string.ulid = true];
  optional string protobuf_fqn = 15 [(buf.validate.field).string.protobuf_fqn = true];
  optional string protobuf_dot_fqn = 16 [(buf.validate.field).string.protobuf_dot_fqn = true];
}

message BytesRuleMatrix {
  optional bytes exact = 1 [(buf.validate.field).bytes.const = "proto"];
  optional bytes exact_length = 2 [(buf.validate.field).bytes.len = 5];
  optional bytes bounded_length = 3 [(buf.validate.field).bytes = { min_len: 3, max_len: 6 }];
  optional bytes patterned = 4 [(buf.validate.field).bytes.pattern = "^[a-z]+$"];
  optional bytes prefixed = 5 [(buf.validate.field).bytes.prefix = "pre"];
  optional bytes suffixed = 6 [(buf.validate.field).bytes.suffix = "post"];
  optional bytes containing = 7 [(buf.validate.field).bytes.contains = "mid"];
  optional bytes allowed = 8 [(buf.validate.field).bytes = { in: ["one", "two"] }];
  optional bytes denied = 9 [(buf.validate.field).bytes = { not_in: ["bad", "deny"] }];
  optional bytes ip = 10 [(buf.validate.field).bytes.ip = true];
  optional bytes ipv4 = 11 [(buf.validate.field).bytes.ipv4 = true];
  optional bytes ipv6 = 12 [(buf.validate.field).bytes.ipv6 = true];
  optional bytes uuid = 13 [(buf.validate.field).bytes.uuid = true];
}

message WellKnownRuleMatrix {
  optional google.protobuf.Duration exact_duration = 1 [
    (buf.validate.field).duration.const = { seconds: 5 }
  ];
  optional google.protobuf.Duration bounded_duration = 2 [
    (buf.validate.field).duration = {
      gte: { seconds: 5 }
      lte: { seconds: 10 }
    }
  ];
  optional google.protobuf.Duration reversed_duration = 3 [
    (buf.validate.field).duration = {
      gt: { seconds: 10 }
      lt: { seconds: 5 }
    }
  ];
  optional google.protobuf.Duration allowed_duration = 4 [
    (buf.validate.field).duration = {
      in: [{ seconds: 5 }, { seconds: 6 }]
    }
  ];
  optional google.protobuf.Duration denied_duration = 5 [
    (buf.validate.field).duration.not_in = { seconds: 5 }
  ];
  optional google.protobuf.FieldMask exact_mask = 6 [
    (buf.validate.field).field_mask.const = { paths: ["display_name"] }
  ];
  optional google.protobuf.FieldMask allowed_mask = 7 [
    (buf.validate.field).field_mask = { in: ["display_name", "settings"] }
  ];
  optional google.protobuf.FieldMask denied_mask = 8 [
    (buf.validate.field).field_mask.not_in = "name"
  ];
  optional google.protobuf.Timestamp exact_timestamp = 9 [
    (buf.validate.field).timestamp.const = { seconds: 1893456000 }
  ];
  optional google.protobuf.Timestamp bounded_timestamp = 10 [
    (buf.validate.field).timestamp = {
      gte: { seconds: 1893456000 }
      lte: { seconds: 1893542400 }
    }
  ];
  optional google.protobuf.Timestamp reversed_timestamp = 11 [
    (buf.validate.field).timestamp = {
      gt: { seconds: 1893542400 }
      lt: { seconds: 1893456000 }
    }
  ];
  optional google.protobuf.Timestamp recent_past = 12 [
    (buf.validate.field).timestamp = {
      lt_now: true
      within: { seconds: 86400 }
    }
  ];
  optional google.protobuf.Timestamp near_future = 13 [
    (buf.validate.field).timestamp = {
      gt_now: true
      within: { seconds: 86400 }
    }
  ];
}

message PredefinedRuleMatrix {
  optional string slug = 1 [
    (buf.validate.field).string.(kebab_case) = true
  ];
}

message ExampleRuleMatrix {
  optional string email = 1 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).string.example = "guide@example.com"
  ];
}

message CelChild {
  option (buf.validate.message).cel = {
    id: "cel.child.name"
    message: "child name must begin with child-"
    expression: "this.name.startsWith('child-')"
  };

  string name = 1;
}

message CelRuleMatrix {
  option (buf.validate.message).cel = {
    id: "cel.message.first"
    message: "first message rule failed"
    expression: "this.message_value == 'ok'"
  };
  option (buf.validate.message).cel = {
    id: "cel.message.second"
    message: "second message rule failed"
    expression: "this.second_message_value == 'ok'"
  };

  string boolean_value = 1 [(buf.validate.field).cel = {
    id: "cel.field.boolean"
    message: "boolean field rule failed"
    expression: "this == 'ok'"
  }];
  string string_value = 2 [(buf.validate.field).cel = {
    id: "cel.field.string"
    expression: "this == 'ok' ? '' : 'received ' + this"
  }];
  string message_value = 3;
  string second_message_value = 4;
  CelChild child = 5;
  repeated CelChild children = 6;
}

message CelProtoLanguageMatrix {
  option (buf.validate.message).cel = {
    id: "cel.proto.messages_enums_presence"
    message: "Protobuf message, enum, and presence operations failed."
    expression: "has(this.optional_value) && has(this.child) && this.status == 1"
  };
  option (buf.validate.message).cel = {
    id: "cel.proto.collections"
    message: "Protobuf list and map operations failed."
    expression: "this.numbers.all(value, value > 0) && this.numbers.exists_one(value, value == 2) && 'primary' in this.scores && this.scores['primary'] == 3"
  };
  option (buf.validate.message).cel = {
    id: "cel.proto.bytes"
    message: "Protobuf bytes operations failed."
    expression: "this.payload == b'proto' && this.payload.size() == 5"
  };
  option (buf.validate.message).cel = {
    id: "cel.proto.temporal"
    message: "Protobuf timestamp and duration operations failed."
    expression: "this.start + this.window == timestamp('2025-01-01T01:00:00Z')"
  };

  optional string optional_value = 1;
  MatrixStatus status = 2;
  bytes payload = 3;
  repeated int32 numbers = 4;
  map<string, int32> scores = 5;
  google.protobuf.Timestamp start = 6;
  google.protobuf.Duration window = 7;
  CelChild child = 8;
}

message RecursiveNode {
  string name = 1;
  RecursiveNode child = 2;
  repeated RecursiveNode children = 3;
}

message RecursiveLeft {
  string name = 1;
  RecursiveRight right = 2;
}

message RecursiveRight {
  string name = 1;
  RecursiveLeft left = 2;
}
