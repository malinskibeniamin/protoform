version: v2
clean: false
plugins:
  - local:
      ["bun", "run", "registry/base-nova/protoform/scripts/protoc-gen-protoform/run.ts"]
    out: conformance/gen
    opt: target=ts,import_extension=js
inputs:
  - directory: conformance/proto
    paths:
      - conformance/proto/protoform/conformance/v1/aip.proto
