name: Release Protoform

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium firefox webkit
      - run: bun run release:verify-tag
      - run: bun run release:gate
      - name: Verify generated source is committed
        run: git diff --exit-code
      - name: Build release archive
        run: |
          bun run packages:pack
          tar -czf "protoform-registry-${GITHUB_REF_NAME}.tar.gz" public/r LICENSE LICENSES THIRD_PARTY_NOTICES.md
          shasum -a 256 "protoform-registry-${GITHUB_REF_NAME}.tar.gz" > "protoform-registry-${GITHUB_REF_NAME}.tar.gz.sha256"
          (cd .tmp/package-artifacts && shasum -a 256 *.tgz) > "protoform-packages-${GITHUB_REF_NAME}.sha256"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            protoform-registry-${{ github.ref_name }}.tar.gz
            .tmp/package-artifacts/*.tgz
      - name: Publish compiled npm packages
        run: |
          npm publish .tmp/package-artifacts/protoform-core-*.tgz
          npm publish .tmp/package-artifacts/protoform-auto-form-*.tgz
          npm publish .tmp/package-artifacts/protoform-react-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish Git-tagged release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "protoform-registry-${GITHUB_REF_NAME}.tar.gz" \
            "protoform-registry-${GITHUB_REF_NAME}.tar.gz.sha256" \
            "protoform-packages-${GITHUB_REF_NAME}.sha256" \
            .tmp/package-artifacts/*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
