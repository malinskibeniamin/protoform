name: Release registry snapshot

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium firefox webkit
      - run: bun run release:verify-tag
      - run: bun run release:gate
      - name: Verify generated source is committed
        run: git diff --exit-code
      - name: Build release archive
        run: |
          tar -czf "protoform-registry-${GITHUB_REF_NAME}.tar.gz" public/r LICENSE LICENSES THIRD_PARTY_NOTICES.md
          shasum -a 256 "protoform-registry-${GITHUB_REF_NAME}.tar.gz" > "protoform-registry-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Attest registry archive provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "protoform-registry-${{ github.ref_name }}.tar.gz"
      - name: Publish Git-tagged source snapshot
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "protoform-registry-${GITHUB_REF_NAME}.tar.gz" \
            "protoform-registry-${GITHUB_REF_NAME}.tar.gz.sha256"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
