name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: 1.26.6
      - run: bun install --frozen-lockfile
      - name: Install Chromium while preflight checks run
        id: install-browser
        background: true
        run: bunx playwright install --with-deps chromium
      - run: bunx buf lint --error-format=github-actions
      - name: Check protobuf compatibility with pull request target
        if: github.event_name == 'pull_request'
        run: bun run proto:breaking -- --against ".git#commit=${{ github.event.pull_request.base.sha }}"
      - name: Check protobuf compatibility with previous main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS_MAIN: ${{ github.event.before }}
        run: |
          if git cat-file -e "${PREVIOUS_MAIN}^{commit}" 2>/dev/null && \
            git merge-base --is-ancestor "$PREVIOUS_MAIN" HEAD; then
            bun run proto:breaking -- --against ".git#commit=${PREVIOUS_MAIN}"
          else
            echo "::notice::Skipping compatibility check because the previous main is unavailable or not an ancestor."
          fi
      - run: bun run security:audit
      - run: bun run registry:build
      - run: bun run test:unit
      - name: Wait for Chromium before browser tests
        wait: install-browser
      # Integration lint-policy tests briefly write invalid fixtures into registry/.
      # Finish them before any repository-wide lint or typecheck can scan them.
      - run: bun run test:integration
      # Keep all quality:gate checks. Only the last lane owns consumer fixtures, browser runners,
      # and the docs build; docs typechecking uses its existing isolated runtime.
      - parallel:
          - name: Lint and analyze source
            run: |
              bun run check:boundaries
              bun run readiness:gate
              bun run lint:no-suppressions
              bun run lint
              bun run doctor:strict
          - name: Typecheck source, tests, and docs
            run: bun run typecheck
          - name: Verify registry consumers, forms, and docs build
            run: |
              bun run registry:smoke
              bun run registry:consumer-smoke
              bun run test:e2e:canary
              bun run registry:host-browser
              bun run test:conformance
              bun run aip:lint
              bun run test:browser
              bun run test:e2e
              bun run docs:blume:translate:check
              bun run build
              bun run docs:blume:audit
      - name: Upload runner failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-failures
          path: .rstest/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - parallel:
          - name: Install Chromium
            run: bunx playwright install --with-deps chromium
          - name: Validate docs
            run: bun run docs:blume:validate
          - name: Check translations
            run: bun run docs:blume:translate:check
      - run: bun run test:quickjs
      - name: Build and exercise docs, demos, accessibility, and screenshots
        run: bun run test:e2e
      - run: bun run docs:blume:audit
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-e2e-failures
          path: .rstest/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
