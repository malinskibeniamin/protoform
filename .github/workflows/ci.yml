name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx buf lint --error-format=github-actions
      - name: Check protobuf compatibility with pull request target
        if: github.event_name == 'pull_request'
        run: bun run proto:breaking -- --against ".git#commit=${{ github.event.pull_request.base.sha }}"
      - name: Check protobuf compatibility with previous main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: bun run proto:breaking -- --against ".git#commit=${{ github.event.before }}"
      - run: bun run ci:gate
